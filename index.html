<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>مرقوم — حساب الجُمَّل</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e3a8a">

<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مرقوم">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --royal-1:#0f1f52;
    --royal-2:#1e3a8a;
    --royal-3:#2b4fb0;
    --silver-1:#e9ecf1;
    --silver-2:#c7ccd6;
    --silver-3:#9aa2b1;
    --silver-deep:#6b7280;
    --ink:#101425;
    --paper:#f3f4f7;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:'Tajawal',sans-serif;
    background:
      radial-gradient(1200px 700px at 20% -10%, #24346b 0%, transparent 60%),
      radial-gradient(1000px 600px at 100% 10%, #16234f 0%, transparent 55%),
      linear-gradient(160deg, var(--royal-1) 0%, var(--ink) 100%);
    color:var(--paper);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }

  .plate{
    width:100%;
    max-width:640px;
    background:
      linear-gradient(155deg, #f5f6f8 0%, #dde1e8 38%, #eef0f4 55%, #d3d8e0 78%, #f2f3f6 100%);
    border-radius:22px;
    padding:2px;
    box-shadow:
      0 1px 0 rgba(255,255,255,.6) inset,
      0 30px 60px -20px rgba(0,0,0,.55),
      0 8px 20px -8px rgba(0,0,0,.4);
    position:relative;
  }
  .plate::before{
    content:"";
    position:absolute; inset:0;
    border-radius:22px;
    padding:1px;
    background:linear-gradient(155deg, rgba(255,255,255,.9), rgba(120,128,145,.5));
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    pointer-events:none;
  }

  .inner{
    background:linear-gradient(180deg, #fbfbfc 0%, #eceef2 100%);
    border-radius:20px;
    padding:38px 32px 30px;
    position:relative;
    overflow:hidden;
  }
  .inner::after{
    content:"";
    position:absolute;
    top:-40%; left:-20%;
    width:140%; height:70%;
    background:linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,0) 70%);
    transform:rotate(-3deg);
    pointer-events:none;
  }

  header{
    text-align:center;
    margin-bottom:26px;
    position:relative;
    z-index:1;
  }
  .badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:190px;height:110px;
    border-radius:50%;
    margin-bottom:16px;
    background:linear-gradient(150deg, var(--royal-3), var(--royal-1) 70%);
    box-shadow:
      0 1px 0 rgba(255,255,255,.5),
      0 10px 22px -8px rgba(15,31,82,.6),
      inset 0 1px 3px rgba(255,255,255,.25),
      inset 0 -6px 10px rgba(0,0,0,.35);
    color:var(--silver-1);
    font-family:'Amiri',serif;
    font-size:36px;
    font-weight:700;
    letter-spacing:.5px;
  }
  h1{
    font-family:'Amiri',serif;
    font-weight:700;
    font-size:34px;
    margin:0 0 4px;
    color:var(--royal-1);
    letter-spacing:.5px;
  }
  .tagline{
    margin:0;
    color:var(--silver-deep);
    font-size:14.5px;
    font-weight:500;
  }

  .field{
    position:relative;
    z-index:1;
    margin-bottom:20px;
  }
  label{
    display:block;
    font-size:13.5px;
    font-weight:700;
    color:var(--royal-2);
    margin-bottom:8px;
  }
  input[type="text"]{
    width:100%;
    font-family:'Amiri',serif;
    font-size:24px;
    padding:14px 18px;
    border-radius:12px;
    border:1px solid var(--silver-3);
    background:linear-gradient(180deg,#ffffff,#f1f2f5);
    box-shadow:inset 0 2px 5px rgba(20,25,45,.08);
    color:var(--ink);
    outline:none;
    transition:box-shadow .15s ease, border-color .15s ease;
  }
  input[type="text"]:focus{
    border-color:var(--royal-3);
    box-shadow:inset 0 2px 5px rgba(20,25,45,.08), 0 0 0 3px rgba(43,79,176,.18);
  }
  .hint{
    margin:8px 2px 0;
    font-size:12.5px;
    color:var(--silver-deep);
  }

  .stats-row{
    position:relative;
    z-index:1;
    display:flex;
    gap:10px;
    margin-bottom:22px;
  }
  .stat-card{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
    background:linear-gradient(135deg, var(--royal-3) 0%, var(--royal-1) 100%);
    border-radius:16px;
    padding:16px 8px;
    box-shadow:
      0 1px 0 rgba(255,255,255,.15) inset,
      0 14px 28px -14px rgba(15,31,82,.7);
  }
  .stat-card.main{
    background:linear-gradient(135deg, var(--silver-1) 0%, var(--silver-2) 100%);
    box-shadow:
      0 1px 0 rgba(255,255,255,.6) inset,
      0 14px 28px -14px rgba(15,31,82,.35);
    border:1px solid var(--silver-2);
  }
  .stat-label{
    font-size:12px;
    font-weight:700;
    color:var(--silver-1);
    opacity:.9;
    text-align:center;
  }
  .stat-card.main .stat-label{
    color:var(--royal-2);
    opacity:1;
  }
  .stat-value{
    font-family:'Amiri',serif;
    font-size:26px;
    font-weight:700;
    color:#fff;
    text-shadow:0 1px 2px rgba(0,0,0,.35);
    direction:ltr;
  }
  .stat-card.main .stat-value{
    color:var(--royal-1);
    font-size:30px;
    text-shadow:none;
  }

  .breakdown{
    position:relative;
    z-index:1;
  }
  .breakdown-title{
    font-size:13.5px;
    font-weight:700;
    color:var(--royal-2);
    margin-bottom:10px;
  }
  .letters{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .chip{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-width:48px;
    padding:8px 6px 7px;
    border-radius:10px;
    background:linear-gradient(180deg,#ffffff,#e3e6ec);
    border:1px solid var(--silver-2);
    box-shadow:0 2px 4px rgba(20,25,45,.06);
  }
  .chip .ch{
    font-family:'Amiri',serif;
    font-size:19px;
    color:var(--ink);
    line-height:1;
  }
  .chip .val{
    font-size:11px;
    color:var(--royal-3);
    font-weight:700;
    margin-top:4px;
    direction:ltr;
  }
  .empty-note{
    color:var(--silver-deep);
    font-size:13.5px;
    padding:6px 2px;
  }

  footer{
    text-align:center;
    margin-top:26px;
    font-size:12px;
    color:var(--silver-3);
    position:relative;
    z-index:1;
  }
  footer .sig{
    display:block;
    margin-top:6px;
    font-family:'Amiri',serif;
    font-weight:700;
    font-size:12.5px;
    letter-spacing:1.5px;
    color:var(--royal-3);
    direction:ltr;
  }

  @media (max-width:420px){
    .inner{padding:30px 20px 24px;}
    .badge{width:150px;height:88px;font-size:28px;}
    .stat-value{font-size:20px;}
    .stat-card.main .stat-value{font-size:24px;}
    .stat-label{font-size:10.5px;}
  }
</style>
</head>
<body>

<div class="plate">
  <div class="inner">
    <header>
      <div class="badge">مرقوم</div>
      <p class="tagline">حساب الجُمَّل — القيمة العددية للحروف الأبجدية</p>
    </header>

    <div class="field">
      <label for="txt">اكتب الكلمة أو الجملة</label>
      <input type="text" id="txt" placeholder="مثال: بسم الله" autocomplete="off">
      <p class="hint">يُحسب كل حرف بقيمته في الأبجدية الكبرى، وتُهمل المسافات والتشكيل</p>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <span class="stat-label">عدد الحروف</span>
        <span class="stat-value" id="charCount">٠</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">عدد الكلمات</span>
        <span class="stat-value" id="wordCount">٠</span>
      </div>
      <div class="stat-card main">
        <span class="stat-label">مجموع الجُمَّل</span>
        <span class="stat-value" id="total">٠</span>
      </div>
    </div>

    <div class="breakdown">
      <div class="breakdown-title">تفصيل الحروف</div>
      <div class="letters" id="letters">
        <span class="empty-note">ابدأ الكتابة لعرض قيمة كل حرف</span>
      </div>
    </div>

    <footer>
      الأبجدية الكبرى: أ=١ ب=٢ ج=٣ ... غ=١٠٠٠
      <span class="sig">Z.Y.H</span>
    </footer>
  </div>
</div>

<script>
  const values = {
    'ا':1,'أ':1,'إ':1,'ى':1,
    'آ':2,
    'ب':2,'ج':3,'د':4,
    'ه':5,'ة':5,
    'و':6,'ز':7,'ح':8,'ط':9,
    'ي':10,'ئ':10,
    'ك':20,'ل':30,'م':40,'ن':50,
    'س':60,'ع':70,'ف':80,'ص':90,
    'ق':100,'ر':200,'ش':300,'ت':400,
    'ث':500,'خ':600,'ذ':700,'ض':800,
    'ظ':900,'غ':1000,
    'ء':1
  };

  const arabicIndicDigits = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
  function toArabicDigits(n){
    return String(n).split('').map(c => /[0-9]/.test(c) ? arabicIndicDigits[+c] : c).join('');
  }

  const input = document.getElementById('txt');
  const totalEl = document.getElementById('total');
  const lettersEl = document.getElementById('letters');
  const charCountEl = document.getElementById('charCount');
  const wordCountEl = document.getElementById('wordCount');

  function render(){
    const text = input.value;
    const chars = [...text].filter(c => values.hasOwnProperty(c));
    const words = text.trim().length ? text.trim().split(/\s+/) : [];

    charCountEl.textContent = toArabicDigits(chars.length);
    wordCountEl.textContent = toArabicDigits(words.length);

    if(chars.length === 0){
      totalEl.textContent = toArabicDigits(0);
      lettersEl.innerHTML = '<span class="empty-note">ابدأ الكتابة لعرض قيمة كل حرف</span>';
      return;
    }

    let sum = 0;
    let chipsHtml = '';
    chars.forEach(ch => {
      const v = values[ch];
      sum += v;
      chipsHtml += `<div class="chip"><span class="ch">${ch}</span><span class="val">${toArabicDigits(v)}</span></div>`;
    });

    totalEl.textContent = toArabicDigits(sum);
    lettersEl.innerHTML = chipsHtml;
  }

  input.addEventListener('input', render);
  render();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    });
  }
</script>

</body>
</html>
